<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Banner desQbro</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --morado: #5B1843;
    --morado-osc: #3F0F2E;
    --amarillo: #FFCE00;
    --gris: #6E6470;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 2560px; height: 1440px; overflow: hidden; background: #fff; }
  body { font-family: "Poppins", sans-serif; position: relative; }

  .blob {
    position: absolute;
    border-radius: 46% 54% 42% 58% / 52% 44% 56% 48%;
  }

  /* Zona segura central (visible en todos los dispositivos): 1546 x 423 */
  .safe {
    position: absolute;
    left: 507px; top: 508px;
    width: 1546px; height: 423px;
    display: flex; align-items: center; gap: 64px;
  }
  .logo { height: 220px; filter: brightness(1.04) saturate(1.05); flex: none; }
  .sep { width: 6px; height: 250px; background: var(--amarillo); border-radius: 3px; flex: none; }
  .txt { flex: 1; }
  .l1 {
    font-size: 66px; font-weight: 800; line-height: 1.08;
    color: var(--morado);
    letter-spacing: -0.5px;
  }
  .l2 {
    display: inline-block;
    margin-top: 10px;
    font-size: 66px; font-weight: 800; line-height: 1.1;
    color: var(--amarillo);
    background: var(--morado);
    padding: 2px 26px 8px;
    border-radius: 18px;
    letter-spacing: -0.5px;
  }
  .l3 {
    margin-top: 22px;
    display: flex; align-items: center; gap: 26px;
    font-size: 27px; font-weight: 600; color: var(--gris);
  }
  .pill {
    display: inline-flex; align-items: center; gap: 12px;
    font-size: 26px; font-weight: 700; color: var(--morado);
    border: 3px solid var(--morado);
    border-radius: 999px;
    padding: 6px 22px;
    white-space: nowrap;
  }
  .pill i {
    width: 0; height: 0;
    border-left: 16px solid var(--morado);
    border-top: 10px solid transparent; border-bottom: 10px solid transparent;
  }

  .icon { position: absolute; }
</style>
</head>
<body>
  <!-- Decoración izquierda (visible en escritorio y TV) -->
  <div class="blob" style="width:620px;height:620px;left:-210px;top:410px;background:var(--amarillo);"></div>
  <div class="blob" style="width:260px;height:260px;left:250px;top:300px;background:var(--morado);opacity:.08;"></div>

  <!-- Balón de fútbol -->
  <svg class="icon" style="left:90px;top:600px" width="240" height="240" viewBox="0 0 100 100">
    <circle cx="50" cy="50" r="44" fill="#fff" stroke="#5B1843" stroke-width="5"/>
    <polygon points="50,33 66,45 60,64 40,64 34,45" fill="#5B1843"/>
    <g stroke="#5B1843" stroke-width="4" stroke-linecap="round">
      <line x1="50" y1="33" x2="50" y2="7"/>
      <line x1="66" y1="45" x2="91" y2="38"/>
      <line x1="60" y1="64" x2="74" y2="85"/>
      <line x1="40" y1="64" x2="26" y2="85"/>
      <line x1="34" y1="45" x2="9" y2="38"/>
    </g>
  </svg>

  <!-- Decoración derecha -->
  <div class="blob" style="width:700px;height:700px;right:-260px;top:380px;background:var(--morado);"></div>
  <div class="blob" style="width:220px;height:220px;right:640px;top:960px;background:var(--amarillo);opacity:.9;"></div>

  <!-- Olas (natación) -->
  <svg class="icon" style="right:70px;top:610px" width="300" height="220" viewBox="0 0 150 110" fill="none" stroke="#FFCE00" stroke-width="7" stroke-linecap="round">
    <path d="M8 30 q 17 -16 34 0 t 34 0 t 34 0 t 34 0"/>
    <path d="M8 58 q 17 -16 34 0 t 34 0 t 34 0 t 34 0"/>
    <path d="M8 86 q 17 -16 34 0 t 34 0 t 34 0 t 34 0"/>
  </svg>

  <!-- Contenido principal -->
  <div class="safe">
    <img class="logo" src="logo-desqbro.jpg" alt="desQbro">
    <div class="sep"></div>
    <div class="txt">
      <div class="l1">Escuelas deportivas que forman bien</div>
      <div class="l2">y son rentables</div>
      <div class="l3">
        <span>Gestión + metodología para academias deportivas infantiles</span>
      </div>
      <div class="l3" style="margin-top:16px">
        <span class="pill"><i></i>Nuevo video cada martes</span>
      </div>
    </div>
  </div>
</body>
</html>
